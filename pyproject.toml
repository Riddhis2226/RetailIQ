[project]
name = "retailiq"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dash>=4.4.1",
    "duckdb>=2.0.0",
    "huggingface-hub>=2.3.0",
    "mlflow>=3.17.2",
    "numpy>=2.4.6",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "polars>=2.0.0",
    "prophet>=1.5.0",
    "pyarrow>=4,<26",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "shap>=0.51.0",
    "supabase>=2.33.0",
    "torch>=2.14.1",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
